# Verifica que o texto em português segue o português europeu (AO90).
# Correção local: npx @joaommotawork/pt-pt-lint --fix
name: pt-PT

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pt-pt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pt-pt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: joaommotawork/packages/packages/pt-pt-lint@main
