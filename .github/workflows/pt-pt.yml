# Verifica que o texto em português segue o português europeu (AO90).
# A Action vem do mirror público joaommota-labs/pt-pt-lint (tag v1).
name: pt-PT

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pt-pt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pt-pt:
    runs-on: ${{ vars.CI_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","joao-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: joaommota-labs/pt-pt-lint@v1
