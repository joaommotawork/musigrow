version: 2
# Baseline from joaommota-labs/project-bootstrap: one grouped PR per
# ecosystem per week.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      all:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      all:
        applies-to: version-updates
        patterns: ["*"]
